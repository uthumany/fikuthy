name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm --dir ui install --frozen-lockfile
      - run: pnpm --dir ui typecheck
      - run: pnpm --dir ui build
      - run: pnpm --dir ui test:package
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release
      - name: Validate platform installer syntax
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            pwsh -NoProfile -Command '$tokens=$null; $errors=$null; [void][System.Management.Automation.Language.Parser]::ParseFile("packaging/install.ps1", [ref]$tokens, [ref]$errors); if ($errors.Count) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }'
          else
            bash -n packaging/install.sh
          fi

  packages:
    name: Package validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Validate npm package
        working-directory: packages/utharnessly-npm
        run: |
          node --check bin/utharnessly.js
          npm pack --dry-run
          expected="$(node -p "require('./package.json').version")"
          test "$(node bin/utharnessly.js --version)" = "utharnessly $expected"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build and validate Python distributions
        working-directory: python/utharnessly
        run: |
          python -m pip install --upgrade build twine
          PYTHONPATH=src python -m unittest discover -s tests -v
          expected="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$(PYTHONPATH=src python -m utharnessly.cli --version)" = "utharnessly $expected"
          python -m build
          python -m twine check --strict dist/*

  termux:
    name: Termux package and CLI smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.19.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - run: pnpm --dir ui install --frozen-lockfile
      - run: pnpm --dir ui build
      - run: cargo build --release
      - name: Validate Termux package scripts and layout
        shell: bash
        run: |
          set -euo pipefail
          for script in packages/utharness/build.sh termux/*.sh; do bash -n "$script"; done
          TERMUX_PACKAGE_OUT="$RUNNER_TEMP/termux-package" TERMUX_ARCH=x86_64 TERMUX_RUST_BINARY="$GITHUB_WORKSPACE/target/release/utharness" TERMUX_UI_DIST="$GITHUB_WORKSPACE/ui/dist" packages/utharness/build.sh
          deb=$(find "$RUNNER_TEMP/termux-package" -maxdepth 1 -name '*.deb' -print -quit)
          test -n "$deb"
          dpkg-deb --contents "$deb" | grep -F './data/data/com.termux/files/usr/bin/utharness'
          dpkg-deb --contents "$deb" | grep -F './data/data/com.termux/files/usr/lib/utharness/dist/index.js'
          if dpkg-deb --contents "$deb" | grep -E '^\./(usr|opt)/'; then exit 1; fi
          sha256sum -c "$deb.sha256"
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          UTHARNESS_ALLOW_UNSIGNED=1 UTHARNESS_VERSION="$version" termux/build-repository.sh "$RUNNER_TEMP/termux-package" "$RUNNER_TEMP/termux-repository"
          test -s "$RUNNER_TEMP/termux-repository/dists/stable/Release"
          test -s "$RUNNER_TEMP/termux-repository/dists/stable/main/binary-x86_64/Packages.gz"
          test -f "$RUNNER_TEMP/termux-repository/UNSIGNED-LOCAL-TEST-ONLY"
      - name: Verify Termux command surface
        shell: bash
        run: |
          set -euo pipefail
          home="$RUNNER_TEMP/termux-home"
          prefix="$home/prefix"
          mkdir -p "$prefix/bin"
          HOME="$home" PREFIX="$prefix" TERMUX_VERSION=0.118.0 UTHARNESS_HOME="$home/.local/share/utharness" target/release/utharness termux setup
          HOME="$home" PREFIX="$prefix" TERMUX_VERSION=0.118.0 target/release/utharness termux info
          HOME="$home" PREFIX="$prefix" TERMUX_VERSION=0.118.0 target/release/utharness termux doctor
          HOME="$home" PREFIX="$prefix" TERMUX_VERSION=0.118.0 target/release/utharness update | grep -F 'pkg update'

  smoke:
    name: CLI smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - run: cargo build --release
      - name: Verify init, memory, and doctor
        shell: bash
        run: |
          workdir="$(mktemp -d)"
          home="$(mktemp -d)"
          cd "$workdir"
          HOME="$home" UTHARNESS_HOME="$home/.utharness" "$GITHUB_WORKSPACE/target/release/utharness" init
          HOME="$home" UTHARNESS_HOME="$home/.utharness" "$GITHUB_WORKSPACE/target/release/utharness" memory add "CI persistence works"
          HOME="$home" UTHARNESS_HOME="$home/.utharness" "$GITHUB_WORKSPACE/target/release/utharness" memory search persistence
          HOME="$home" UTHARNESS_HOME="$home/.utharness" "$GITHUB_WORKSPACE/target/release/utharness" doctor
          HOME="$home" UTHARNESS_HOME="$home/.utharness" "$GITHUB_WORKSPACE/target/release/utharness" skills search git
          HOME="$home" UTHARNESS_HOME="$home/.utharness" "$GITHUB_WORKSPACE/target/release/utharness" skills install builtin.git-status
          HOME="$home" UTHARNESS_HOME="$home/.utharness" "$GITHUB_WORKSPACE/target/release/utharness" skills test builtin.git-status
          HOME="$home" UTHARNESS_HOME="$home/.utharness" "$GITHUB_WORKSPACE/target/release/utharness" skills doctor
          HOME="$home" UTHARNESS_HOME="$home/.utharness" "$GITHUB_WORKSPACE/target/release/utharness" skills remove builtin.git-status
