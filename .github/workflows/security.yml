name: Security

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
          cache: false
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - run: cargo audit
      - name: Install Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan repository history for credentials
        run: gitleaks git --redact --verbose .
      - name: Check for common committed token formats
        shell: bash
        run: |
          if grep -RInE '(sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|xoxb-[A-Za-z0-9-]{20,})' --exclude-dir=.git --exclude='*.lock' .; then
            echo "Potential credential found in the repository."
            exit 1
          fi
