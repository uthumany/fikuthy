[workspace]
resolver = "2"
members = [
  "crates/utharness-core",
  "crates/utharness-storage",
  "crates/utharness-security",
  "crates/utharness-cli",
  "crates/utharness-provider",
]

[workspace.package]
version = "0.2.13"
edition = "2021"
license = "MIT"
authors = ["Utharness Contributors"]
repository = "https://github.com/uthumany/utharnessly"

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde", "clock"] }
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = "0.28"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
regex = "1.11"
sha2 = "0.10"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.10", features = ["v4", "v7", "serde"] }
tempfile = "3.14"
wait-timeout = "0.2"
