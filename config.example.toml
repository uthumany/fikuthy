# Copy to ~/.config/utharness/config.toml
workspace = "~/projects/example"
permission_mode = "SAFE"
theme = "utharness-carbon"
provider = "offline"
model = "offline-planner"

[storage]
# The default is ~/.local/share/utharness/utharness.db
durable_writes = false

[providers.offline]
name = "Offline planner"
local = true
enabled = true

# API keys belong in the OS keyring or environment variables, never in Git.
